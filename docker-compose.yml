services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recon
    ports:
      - "5432:5432"
    volumes:
      - recon-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recon"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  recon-pg:
